
name: Publish OpenSky Aircraft Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch global aircraft data
        run: |
          mkdir -p site
          python - <<'PY'
          import json
          import urllib.request

          url = "https://opensky-network.org/api/states/all"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "AirplaneTracker/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          states = data.get("states") or []
          snapshot = {
              "source": "OpenSky",
              "time": data.get("time"),
              "count": len(states),
              "states": states
          }

          with open("site/aircraft-snapshot.json", "w") as file:
              json.dump(snapshot, file)

          print("Aircraft count:", len(states))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
