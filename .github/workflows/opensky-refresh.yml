
name: Refresh OpenSky Aircraft Snapshot

on:
  workflow_dispatch:

jobs:
  fetch-aircraft:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch global aircraft data
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://opensky-network.org/api/states/all"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "AirplaneTracker/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          states = data.get("states") or []

          snapshot = {
              "source": "OpenSky",
              "time": data.get("time"),
              "count": len(states),
              "states": states
          }

          with open("aircraft-snapshot.json", "w") as file:
              json.dump(snapshot, file)

          print("Aircraft count:", len(states))
          print("Snapshot created successfully.")
          PY

      - name: Upload aircraft snapshot
        uses: actions/upload-artifact@v4
        with:
          name: aircraft-snapshot
          path: aircraft-snapshot.json
          retention-days: 1
